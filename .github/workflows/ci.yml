name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Lint Commits
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: commitlint-${{ hashFiles('.commitlintrc.yml') }}
          restore-keys: commitlint-
      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@21.2.1 \
            @commitlint/config-conventional@21.2.0
      - name: Validate commit messages
        run: |
          result=0
          for sha in $(git rev-list --first-parent \
              ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            echo "::group::$sha"
            git log -1 --format=%B "$sha" | npx commitlint --verbose || result=1
            echo "::endgroup::"
          done
          exit $result

  check-base:
    name: Check Branch Base
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify branch is up-to-date with main
        run: |
          git fetch origin main
          base_commit=$(git merge-base origin/main HEAD)
          main_head=$(git rev-parse origin/main)
          if [ "$base_commit" != "$main_head" ]; then
            behind=$(git rev-list --count "$base_commit".."$main_head")
            echo "::error::Branch is $behind commit(s) behind main. Please update your branch with the latest main."
            echo "Run: git fetch origin && git rebase origin/main  # or merge: git fetch origin && git merge origin/main"
            exit 1
          fi

  ci-result:
    name: CI Result
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions: {}
    needs: [commitlint, check-base]
    if: always()
    steps:
      - name: Check all CI jobs passed
        run: |
          for result in "${{ needs.commitlint.result }}" "${{ needs.check-base.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "CI check failed or cancelled: $result"
              exit 1
            fi
          done
          echo "All CI checks passed"