# Vibe agent fragment for coder-guard (generates config/vibe/agents/coder-guard.toml).
# No active_model: delegates inherit the session model (session default Mistral-hosted zai-glm-5-3-flash @ thinking low, pinned in ~/.vibe/config.toml -- mirrors the pi delegate model; flash hosting landed after mistralai/mistral-vibe#1249, thinking low/high/max accepted since vibe 3.0.4 per #1115).
agent_type: subagent
display_name: Coder Guard
description: Adversarial reviewer focusing on risk, safety, and minimalism. Stress-tests Scout's proposals and re-ranks by safety.
safety: neutral
enabled_tools:
  # Code analysis: aptu-coder MCP tools (preferred per Constraint #8).
  - aptu-coder_analyze_directory
  - aptu-coder_analyze_module
  - aptu-coder_analyze_file
  - aptu-coder_analyze_symbol
  # Fallback built-ins (for when MCP groups are dropped by unified harness,
  # mistralai/mistral-vibe#1159): run with --legacy-harness for full MCP access.
  - read_file
  - grep
  - bash
