# Vibe agent fragment for coder-build (generates config/vibe/agents/coder-build.toml).
# active_model + [models] thinking override emitted by the generator: effort policy is self-contained per agent, parity with pi/goose frontmatter (maintainer workaround, mistralai/mistral-vibe#1501). When #1501 ships first-class per-agent thinking, switch to the native key. Pinned level wins over /thinking.
agent_type: subagent
display_name: Coder Build
description: Implements approved plans and verifies with tests. Writes code, tests, and verification.
safety: destructive
enabled_tools:
  # Code analysis: aptu-coder MCP tools (preferred per Constraint #8).
  - aptu-coder_analyze_directory
  - aptu-coder_analyze_module
  - aptu-coder_analyze_file
  - aptu-coder_analyze_symbol
  - aptu-coder_exec_command
  - aptu-coder_edit_overwrite
  # Fallback built-ins (for when MCP groups are dropped by unified harness,
  # mistralai/mistral-vibe#1159): run with --legacy-harness for full MCP access.
  - read_file
  - grep
  - bash
  - write_file
  - edit
