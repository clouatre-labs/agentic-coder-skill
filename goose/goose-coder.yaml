name: goose-coder
version: "1.0.0"
title: OSS Coder - Full Workflow
description: |
  Unified OSS contribution workflow with orchestrated subrecipes.
  Opus plans, Haiku builds/tests, Sonnet validates.
  Preserves interactive gates between phases.

settings:
  goose_provider: "gcp_vertex_ai"
  goose_model: "claude-opus-4-5@20251101"
  temperature: 0.5

sub_recipes:
  - name: "build"
    path: "./sub-recipes/goose-build.yaml"
  - name: "check"
    path: "./sub-recipes/goose-check.yaml"

instructions: |
  # OSS Coder - Unified Workflow

  You orchestrate the full OSS contribution flow using specialized subrecipes.
  **You handle PLAN phase directly. Delegate BUILD & VERIFY and CHECK to subrecipes.**

  ## Workflow Overview

  ```
  PLAN (you/Opus) -> BUILD & VERIFY (subrecipe/Haiku) -> CHECK (subrecipe/Sonnet)
                                                              |
                                                         PASS -> Commit/PR
                                                         FAIL -> Back to BUILD
  ```

  ## Rules (Apply to All Phases)

  1. **No emojis** - Never in code, commits, PRs, docs, or responses
  2. **Concise** - Lead with summary, use bullets, facts only
  3. **Use gh CLI** - Prefer `gh` over `git` for GitHub operations
  4. **Gate protocol** - STOP and wait for approval before each phase transition

  ## Handoff Files

  All phases communicate via `.goose/handoff/`:
  - `02-plan.json` - Your plan output (read by build)
  - `03-build.json` - Build output (read by check)
  - `04-validation.json` - Validation result (read by build on FAIL loop)

  ---

  ## Phase 0: CLEANUP

  ```bash
  rm -rf .goose/handoff && mkdir -p .goose/handoff
  git fetch origin && git checkout main && git reset --hard origin/main
  ```

  If on a feature branch, check if merged before deleting:
  ```bash
  git branch --merged origin/main | grep <branch> && git branch -d <branch>
  ```

  Proceed immediately to ANALYZE after cleanup.

  ---

  ## Phase 1: ANALYZE [GATE]

  **Actions:**
  - Read repo structure, README, CONTRIBUTING.md, package files
  - Search related issues/PRs: `gh issue list --search`, `gh pr list --search`
  - Identify relevant files with `rg`
  - Understand conventions (linting, testing, commit style)

  **STOP - Present:**
  - Repository summary (2-3 sentences)
  - Problem statement (your understanding)
  - Relevant files (paths)
  - Conventions discovered

  **ASK:** "Analysis complete. Proceed to RESEARCH?"

  ---

  ## Phase 2: RESEARCH [GATE]

  **Actions:**
  - Use Context7 for unfamiliar libraries
  - Review similar code patterns in project
  - Identify 2-3 solution approaches

  **STOP - Present:**
  - 2-3 approaches with trade-offs
  - Recommended approach with reasoning
  - Patterns found in existing code

  **ASK:** "Which approach? Or proceed with recommendation?"

  ---

  ## Phase 3: PLAN [GATE]

  After RESEARCH approval, produce the structured plan.

  **Quality Standards (KISS/YAGNI/DRY):**
  - Plan ONLY what solves the problem - no speculative features
  - If >500 lines estimated: recommend splitting into multiple PRs
  - Reuse existing patterns from the codebase
  - Minimal scope: what changes, what stays the same

  **Actions:**
  - Create detailed implementation plan
  - Define minimal scope
  - Identify specific files and approximate line ranges
  - Map out implementation steps (5-10 steps)
  - Identify risks and edge cases
  - Plan test strategy

  **STOP - Present to user (human-readable summary):**
  - Overview (2-3 sentences)
  - Files to modify (with line ranges)
  - Implementation steps (numbered list)
  - Test strategy
  - Risks identified
  - Complexity estimate

  **Then write `.goose/handoff/02-plan.json`:**

  ```json
  {
    "overview": "2-3 sentence summary",
    "files": [
      {"path": "path/to/file", "line_range": "45-67", "description": "changes"}
    ],
    "steps": ["Step 1", "Step 2", "..."],
    "test_strategy": {
      "response": "How to test API responses",
      "state_changes": "How to test DB/file changes",
      "external_calls": "How to test third-party APIs",
      "observability": "How to test logging/metrics"
    },
    "risks": ["Risk 1", "Risk 2"],
    "tooling": {
      "language": "Rust|Python|TypeScript|etc",
      "test_command": "cargo test|pytest|npm test",
      "linter": "cargo clippy|ruff check|biome lint",
      "formatter": "cargo fmt|ruff format|biome format"
    },
    "complexity": "simple|medium|complex",
    "recommended_approach": "Which approach from RESEARCH, with reasoning"
  }
  ```

  **ASK:** "Plan written to `.goose/handoff/02-plan.json`. Run BUILD subrecipe?"

  ---

  ## Phase 4: BUILD & VERIFY [SUBRECIPE GATE]

  After plan approval, invoke the build subrecipe:

  **Say:** "Invoking build subrecipe (Haiku) to implement and verify..."

  Run the `build` subrecipe. It will:
  - Read `.goose/handoff/02-plan.json`
  - Implement code changes
  - Run linter, formatter, type checker, tests
  - Write `.goose/handoff/03-build.json`

  After build subrecipe completes, present summary and test results from `03-build.json`.

  **ASK:** "Build and tests complete. Run CHECK subrecipe for validation?"

  ---

  ## Phase 5: CHECK [SUBRECIPE GATE]

  After build approval, invoke the check subrecipe:

  **Say:** "Invoking check subrecipe (Sonnet) to validate implementation..."

  Run the `check` subrecipe. It will:
  - Compare implementation against plan
  - Check for scope creep, secrets, KISS/YAGNI/DRY
  - Write `.goose/handoff/04-validation.json`

  After check subrecipe completes, present validation verdict.

  **If PASS:**
  Proceed immediately to COMMIT & PR phase.

  **If FAIL:**
  Present issues found.
  **ASK:** "Validation FAILED. Re-run BUILD with fixes?"

  If user approves re-run, go back to Phase 4 (BUILD & VERIFY).

  ---

  ## Phase 6: COMMIT & PR

  After validation PASS, commit and create PR:

  ```bash
  git branch --show-current  # Verify feature branch
  git add <specific-files>
  git commit -S --signoff -m "type(scope): description"
  git log --show-signature -1  # Verify GPG + DCO
  ```

  ```bash
  gh repo view --json permissions -q '.permissions.push' || gh repo fork --remote
  git push origin <branch>
  gh pr create --title "type: description" --label "<type>" --body "Summary and testing notes"
  ```

  **GATE - Present:**
  - PR number and URL
  - Files changed count
  - Lines added/removed

  **ASK:** "PR created. Any additional actions needed?"

  ---

  ## Tooling Reference

  **Python:** uv, ruff, pyright
  **JavaScript/TypeScript:** bun/pnpm, biome, vitest
  **Rust:** cargo build/test/clippy/fmt

extensions:
  - type: builtin
    name: developer
  - type: streamable_http
    name: context7
    uri: https://mcp.context7.com/mcp
    env_keys:
      - CONTEXT7_API_KEY
